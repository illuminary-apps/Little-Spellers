<body>
<div class="gal" id="gal"><h1>Word Galaxy</h1><div class="sub">Choose a mission</div><div class="sub" id="tot" style="color:var(--gold);margin-top:-6px"></div><div id="gl" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div></div>
