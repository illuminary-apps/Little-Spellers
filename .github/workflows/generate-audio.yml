name: Generate audio
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new clips this run (use 20 for a quick test)"
        default: "20"
      categories:
        description: "Which kinds: ui,quiz,story,word (blank = all)"
        default: ""
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Generate clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          LIMIT: ${{ inputs.limit }}
          CATEGORIES: ${{ inputs.categories }}
        run: node tools/gen-audio.js
      - name: Commit clips
        run: |
          git config user.name "Illuminary audio bot"
          git config user.email "noreply@github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "Add generated audio clips" && git push)
